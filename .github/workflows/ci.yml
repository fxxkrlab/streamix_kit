name: StreamixKit checks

# GitHub-hosted runner (user decision 2026-11-26): this repository is public, so hosted
# runners are free and spec syncs no longer need a workstation build. Every pull request
# runs these checks; a pull request merges only when they pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamix-kit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: never
    steps:
      # actions/checkout v7.0.1, pinned to its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public boundary and synchronized contract
        run: |
          python3 --version
          python3 tools/check_credentials.py
          python3 tools/check_links.py
          python3 tools/check_spec.py
          python3 tools/check_sdk_contract.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: OpenAPI 3.1 schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check openapi-spec-validator==0.7.2
          "$RUNNER_TEMP/venv/bin/python" -m openapi_spec_validator spec/sxapi-v1-client.openapi.json
      - name: Rust 1.98.0 toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustc +1.98.0 --version
          cargo +1.98.0 clippy --version
      - name: Rust check, lint and mock tests
        run: |
          cargo +1.98.0 check --workspace --all-targets
          cargo +1.98.0 clippy --workspace --all-targets -- -D warnings
          cargo +1.98.0 test --workspace --all-targets
          cargo +1.98.0 test --workspace --doc
