name: StreamixKit designated-server checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamix-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client-checks:
    # The release owner verifies this repository's registration and disposal
    # controls before dispatch. This file does not register a Runner.
    runs-on: [self-hosted, Linux, X64, portfolio-ci, portfolio-container]
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public boundary and synchronized contract
        run: |
          python3 tools/check_credentials.py
          python3 tools/check_links.py
          python3 tools/check_spec.py
          python3 tools/check_sdk_contract.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: OpenAPI 3.1 schema
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check openapi-spec-validator==0.7.2
          .ci-venv/bin/python -m openapi_spec_validator spec/sxapi-v1.openapi.json
          .ci-venv/bin/python -m openapi_spec_validator spec/sxapi-v1-client.openapi.json
      - name: Rust check, lint and mock tests
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo test --workspace --doc
      - name: Dispose job-local data
        if: always()
        run: |
          rm -rf -- target .ci-cargo .ci-venv
          # The mandatory Runner hooks also discard checkout and interrupted jobs.
